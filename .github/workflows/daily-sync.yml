name: Faro — sincronización cada 15 minutos

# Pide a Faro que traiga lo nuevo de Tiendanube y Meta para todos los negocios.
# Requiere el secret CRON_SECRET (el mismo valor que en Vercel).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al sync de Faro
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FARO_URL: ${{ vars.FARO_URL || 'https://forever-dashboard.vercel.app' }}
        run: |
          code=$(curl -s -o out.json -w "%{http_code}" --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$FARO_URL/api/v2/cron/sync")
          cat out.json; echo
          test "$code" = "200"
